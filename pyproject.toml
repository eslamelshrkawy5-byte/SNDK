[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sndk-signal-bot"
dynamic = ["version"]
description = "Conservative SNDK signal monitor with Telegram notifications"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.12.3",
  "exchange-calendars==4.6",
  "feedparser==6.0.11",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "requests==2.32.3",
  "yfinance==0.2.54",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.7",
]

[project.scripts]
sndk-bot = "sndk_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "sndk_bot.__version__"}

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
