name: SNDK signal monitor

on:
  schedule:
    # GitHub cron is UTC. 07:30 UTC is 10:30 Riyadh; 08:15 covers the second report.
    # The 07:30-22:45 UTC window covers US premarket through after-hours year-round.
    - cron: "30,45 7 * * 1-5"
    - cron: "*/15 8-22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the normal monitor or send one Telegram connection test"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - health-check
          - button-test

concurrency:
  group: sndk-signal-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Run SNDK monitor or Telegram health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: data/state.json
          DISPATCH_MODE: ${{ inputs.mode || 'normal' }}
        shell: bash
        run: |
          if [[ "${DISPATCH_MODE}" == "health-check" ]]; then
            python -m sndk_bot.main --health-check
          elif [[ "${DISPATCH_MODE}" == "button-test" ]]; then
            python -m sndk_bot.main --button-test
          else
            python -m sndk_bot.main
          fi

      - name: Persist bot state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'normal')
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: persist SNDK bot state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          echo "Unable to persist state after retries" >&2
          exit 1
